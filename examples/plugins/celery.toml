# Celery worker logs:
# [2023-10-03 12:00:01,123: INFO/MainProcess] Task app.tasks.send_email[8f3c...] succeeded in 0.42s: None
name = "celery"
version = "1.0.0"
description = "Celery worker logs"
author = "splash"

[patterns]
succeeded = '^\[(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}): (?P<level>[A-Z]+)/(?P<module>[\w-]+)\] Task (?P<request>[\w.]+)\[(?P<transaction>[0-9a-f-]+)\] (?P<success>succeeded) in (?P<duration>[\d.]+s)(?P<message>.*)$'
failed = '^\[(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}): (?P<level>[A-Z]+)/(?P<module>[\w-]+)\] Task (?P<request>[\w.]+)\[(?P<transaction>[0-9a-f-]+)\] (?P<failure>raised unexpected)(?P<message>.*)$'
other = '^\[(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}): (?P<level>[A-Z]+)/(?P<module>[\w-]+)\] (?P<message>.*)$'
